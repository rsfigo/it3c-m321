# Ausbaustufe 2: Broker, chat-service, Datenbank und batch-writer.
# Keycloak, web-gateway und load-generator kommen in späteren Schritten dazu.
services:

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - chat-net
    healthcheck:
      # "ping" ist schon grün, bevor der AMQP-Port Verbindungen annimmt. Dann
      # startet der chat-service zu früh und antwortet auf die ersten
      # Nachrichten mit 503. check_port_connectivity wartet auf den Port.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-net

  # Speichert den Chat-Verlauf. Einziger Schreiber ist der batch-writer.
  postgres:
    image: postgres:16
    environment:
      # Mit diesen drei Werten legt das Image beim ersten Start Datenbank und
      # Benutzer an. Der batch-writer liest dieselben Variablen.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Benannter Datenträger: der Verlauf überlebt einen Neustart des
      # Containers. Gelöscht wird er erst mit "docker compose down -v".
      - chat-db-data:/var/lib/postgresql/data
    networks:
      - chat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Der einzige Schreiber in die Tabelle message. Holt die Nachrichten
  # stapelweise aus chat.persist. Skalierbar mit --scale batch-writer=N:
  # alle Instanzen teilen sich dieselbe Queue (Competing Consumers).
  batch-writer:
    build:
      context: .
      dockerfile: batch-writer/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Nur ein Sicherheitsnetz: der Dienst soll laut Spezifikation 3.5 gar
    # nicht abstürzen. Von Hand gestoppt (Szenario S4) bleibt er gestoppt.
    restart: unless-stopped
    networks:
      - chat-net

# KEIN ports:-Eintrag in dieser Datei. Der einzige offene Port des
# Gesamtsystems gehört später dem web-gateway.
volumes:
  chat-db-data:

networks:
  chat-net:
    name: chat-net
