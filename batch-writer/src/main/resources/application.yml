spring:
  application:
    name: batch-writer
  rabbitmq:
    # Im Docker-Netz heisst der Broker "rabbitmq". Beim Start ausserhalb
    # von Docker greift der Vorgabewert "localhost".
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    # Dieselben drei Variablen, mit denen der Container postgres beim ersten
    # Start Datenbank und Benutzer anlegt.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:chat}
    username: ${POSTGRES_USER:chat}
    password: ${POSTGRES_PASSWORD:chat}
  sql:
    init:
      # schema.sql bei jedem Start ausführen, nicht nur bei eingebetteten
      # Datenbanken. Das Skript ist mit IF NOT EXISTS wiederholbar.
      mode: always
      # Starten zwei Instanzen gleichzeitig auf einer leeren Datenbank, kann
      # eine das CREATE verlieren. Die Tabelle gibt es dann trotzdem, also
      # weiterlaufen statt abstürzen.
      continue-on-error: true

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
